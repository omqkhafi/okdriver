# Release pipeline for OKDriver (ADR 043). Read docs/RELEASING.md before touching this file.
#
# build    Two independent builds on two runners: frozen install, typecheck, typecheck:tests,
#          bun test, then `bun pm pack`. Each leg uploads its tarball and the tarball's sha256.
# verify   Fails unless the two tarballs are byte-identical, runs the shared pack check, makes an
#          SPDX SBOM (kept as a workflow artifact) and prints the tarball sha256.
# dry-run  workflow_dispatch only. Repacks the verified tarball as 0.0.0-dryrun.0 and runs
#          `npm stage publish --dry-run`. No id-token, nothing is staged.
# stage    Tag push only, environment `release`. Checks the tag, then stages the verified tarball
#          with OIDC and provenance. Nothing is published: a maintainer approves the staged
#          package on npm, which asks for two-factor authentication.
#
# The npm CLI is only the registry client here: bun cannot do OIDC or staged publishing.
# Everything else, packing included, runs on bun. No tokens, no npm publish, no cache.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  NPM_VERSION: "11.21.3"
  NPM_MIN_VERSION: "11.15.0"

jobs:
  build:
    name: build ${{ matrix.leg }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        leg: ["a", "b"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun --version
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run typecheck:tests
      - run: bun test
      - name: Pack
        run: |
          mkdir -p "$RUNNER_TEMP/pack"
          bun pm pack --quiet --filename "$RUNNER_TEMP/pack/okdriver.tgz"
          (cd "$RUNNER_TEMP/pack" && sha256sum okdriver.tgz | tee okdriver.tgz.sha256)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tarball-${{ matrix.leg }}
          path: |
            ${{ runner.temp }}/pack/okdriver.tgz
            ${{ runner.temp }}/pack/okdriver.tgz.sha256
          if-no-files-found: error

  verify:
    name: verify
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      sha256: ${{ steps.hash.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install npm ${{ env.NPM_VERSION }}
        run: |
          npm install --global --ignore-scripts "npm@$NPM_VERSION"
          version="$(npm --version)"
          echo "npm $version"
          lowest="$(printf '%s\n%s\n' "$version" "$NPM_MIN_VERSION" | sort -V | head -n 1)"
          if [ "$lowest" != "$NPM_MIN_VERSION" ]; then
            echo "npm $version is below $NPM_MIN_VERSION" >&2
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: tarball-*
          path: ${{ runner.temp }}/tarballs
      - name: Check that both tarballs are byte-identical
        working-directory: ${{ runner.temp }}/tarballs
        run: |
          (cd tarball-a && sha256sum --check okdriver.tgz.sha256)
          (cd tarball-b && sha256sum --check okdriver.tgz.sha256)
          cmp tarball-a/okdriver.tgz tarball-b/okdriver.tgz
          echo "tarball-a and tarball-b are byte-identical"
      - name: Check the pack
        run: node .github/scripts/check-pack.mjs "$RUNNER_TEMP/tarballs/tarball-a/okdriver.tgz"
      - name: Generate the SPDX SBOM
        run: |
          # npm sbom fails on missing devDependencies, so describe the packed package.json
          # with devDependencies removed, in a scratch directory.
          mkdir -p "$RUNNER_TEMP/sbom-src" "$RUNNER_TEMP/sbom-out"
          tar -xzf "$RUNNER_TEMP/tarballs/tarball-a/okdriver.tgz" -C "$RUNNER_TEMP/sbom-src" \
            --strip-components=1 package/package.json
          (cd "$RUNNER_TEMP/sbom-src" \
            && npm pkg delete devDependencies \
            && npm sbom --sbom-format spdx > "$RUNNER_TEMP/sbom-out/okdriver.spdx.json")
          node -e '
            const fs = require("node:fs");
            const sbom = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const root = sbom.packages.find((p) => p.SPDXID === sbom.documentDescribes[0]);
            if (!String(sbom.spdxVersion).startsWith("SPDX-") || !root || root.name !== "okdriver") {
              console.error("SBOM is not an SPDX document whose root package is okdriver");
              process.exit(1);
            }
            console.log(`SBOM ${sbom.spdxVersion}: root ${root.name}@${root.versionInfo}, ${sbom.packages.length} package(s)`);
          ' "$RUNNER_TEMP/sbom-out/okdriver.spdx.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: ${{ runner.temp }}/sbom-out/okdriver.spdx.json
          if-no-files-found: error
      - name: Print the tarball sha256
        id: hash
        run: |
          sha256="$(sha256sum "$RUNNER_TEMP/tarballs/tarball-a/okdriver.tgz" | cut -d ' ' -f 1)"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          {
            echo "### Verified tarball"
            echo
            echo "Two independent builds are byte-identical."
            echo
            echo "- sha256: \`$sha256\`"
            echo "- npm: \`$(npm --version)\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "tarball sha256: $sha256"

  dry-run:
    name: dry-run
    if: github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      EXPECTED_SHA256: ${{ needs.verify.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install npm ${{ env.NPM_VERSION }}
        run: |
          npm install --global --ignore-scripts "npm@$NPM_VERSION"
          version="$(npm --version)"
          echo "npm $version"
          lowest="$(printf '%s\n%s\n' "$version" "$NPM_MIN_VERSION" | sort -V | head -n 1)"
          if [ "$lowest" != "$NPM_MIN_VERSION" ]; then
            echo "npm $version is below $NPM_MIN_VERSION" >&2
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tarball-a
          path: ${{ runner.temp }}/tarball
      - name: Check the tarball is the verified one
        run: |
          actual="$(sha256sum "$RUNNER_TEMP/tarball/okdriver.tgz" | cut -d ' ' -f 1)"
          if [ "$actual" != "$EXPECTED_SHA256" ]; then
            echo "sha256 $actual does not match the verified $EXPECTED_SHA256" >&2
            exit 1
          fi
      - name: Repack as 0.0.0-dryrun.0
        # 0.0.0-dryrun.0 is never published. 0.0.0 is already on npm and would fail the dry run.
        run: |
          mkdir -p "$RUNNER_TEMP/dryrun-src" "$RUNNER_TEMP/dryrun-out"
          tar -xzf "$RUNNER_TEMP/tarball/okdriver.tgz" -C "$RUNNER_TEMP/dryrun-src" --strip-components=1
          (cd "$RUNNER_TEMP/dryrun-src" \
            && npm pkg set version=0.0.0-dryrun.0 \
            && bun pm pack --quiet --filename "$RUNNER_TEMP/dryrun-out/okdriver-dryrun.tgz")
          node .github/scripts/check-pack.mjs "$RUNNER_TEMP/dryrun-out/okdriver-dryrun.tgz"
      - name: Dry-run stage publish
        run: npm stage publish --dry-run "$RUNNER_TEMP/dryrun-out/okdriver-dryrun.tgz" --tag dryrun

  stage:
    name: stage
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      EXPECTED_SHA256: ${{ needs.verify.outputs.sha256 }}
      TAG_NAME: ${{ github.ref_name }}
      TAG_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install npm ${{ env.NPM_VERSION }}
        run: |
          npm install --global --ignore-scripts "npm@$NPM_VERSION"
          version="$(npm --version)"
          echo "npm $version"
          lowest="$(printf '%s\n%s\n' "$version" "$NPM_MIN_VERSION" | sort -V | head -n 1)"
          if [ "$lowest" != "$NPM_MIN_VERSION" ]; then
            echo "npm $version is below $NPM_MIN_VERSION" >&2
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tarball-a
          path: ${{ runner.temp }}/tarball
      - name: Check the tarball is the verified one
        run: |
          actual="$(sha256sum "$RUNNER_TEMP/tarball/okdriver.tgz" | cut -d ' ' -f 1)"
          if [ "$actual" != "$EXPECTED_SHA256" ]; then
            echo "sha256 $actual does not match the verified $EXPECTED_SHA256" >&2
            exit 1
          fi
      - name: Check the tag
        run: |
          version="$(tar -xzOf "$RUNNER_TEMP/tarball/okdriver.tgz" package/package.json \
            | node -e 'process.stdout.write(JSON.parse(require("node:fs").readFileSync(0, "utf8")).version)')"
          if [ "$TAG_NAME" != "v$version" ]; then
            echo "tag $TAG_NAME does not match package.json version v$version" >&2
            exit 1
          fi
          git rev-parse --verify --quiet origin/main > /dev/null
          if ! git merge-base --is-ancestor "$TAG_COMMIT" origin/main; then
            echo "tag commit $TAG_COMMIT is not an ancestor of origin/main" >&2
            exit 1
          fi
          case "$version" in
            *-*) dist_tag=next ;;
            *) dist_tag=latest ;;
          esac
          echo "DIST_TAG=$dist_tag" >> "$GITHUB_ENV"
          echo "tag $TAG_NAME ok, dist-tag $dist_tag"
      - name: Stage publish
        run: npm stage publish "$RUNNER_TEMP/tarball/okdriver.tgz" --provenance --tag "$DIST_TAG"
