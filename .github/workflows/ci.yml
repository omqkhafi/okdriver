# CI for OKDriver.
#
# checks   The repo's own gates on the Bun pinned in .bun-version: install from the frozen
#          lockfile, typecheck src/, typecheck the tests, run bun test.
# node     Maintained Node.js lines. Each leg runs the runtime smoke test on that major,
#          with no install step and no Bun. P0-T10 (ADR 029) decides the minimum and edits this matrix.
# bun      Bun "latest" (current stable release) and "canary" (informative only, not a gate).
#          Smoke test only.
# workerd  The workerd version pinned in package.json and bun.lock, run through `workerd test`
#          with the fixed compatibilityDate in tests/runtime/workerd.capnp.
# pack     Packs twice from two copies of the checkout with different file mtimes, requires
#          byte-identical tarballs, and runs the shared pack check. No install step.
#
# Every job passes the runtime it asked for in EXPECT_RUNTIME, so a job that landed on the
# wrong runtime fails instead of passing.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun --version
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run typecheck:tests
      - run: bun test

  node:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24", "26"]
    env:
      EXPECT_RUNTIME: node:${{ matrix.node }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: node --version
      - run: node tests/runtime/run.mjs

  bun:
    name: bun ${{ matrix.bun }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    continue-on-error: ${{ matrix.bun == 'canary' }}
    strategy:
      fail-fast: false
      matrix:
        bun: ["latest", "canary"]
    env:
      EXPECT_RUNTIME: bun
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ matrix.bun }}
      - run: bun --version
      - run: bun tests/runtime/run.mjs

  workerd:
    name: workerd
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECT_RUNTIME: workerd
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: node_modules/.bin/workerd --version
      - run: node_modules/.bin/workerd test tests/runtime/workerd.capnp

  pack:
    name: pack
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun --version
      - name: Pack twice from two copies with different mtimes
        run: |
          cp -a . "$RUNNER_TEMP/copy-a"
          cp -a . "$RUNNER_TEMP/copy-b"
          find "$RUNNER_TEMP/copy-a" -exec touch -h -d '2001-01-01 00:00:00 UTC' {} +
          find "$RUNNER_TEMP/copy-b" -exec touch -h -d '2020-06-15 12:34:56 UTC' {} +
          if [ "$(stat -c %Y "$RUNNER_TEMP/copy-a/package.json")" = "$(stat -c %Y "$RUNNER_TEMP/copy-b/package.json")" ]; then
            echo "the two copies must have different mtimes" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/pack-a" "$RUNNER_TEMP/pack-b"
          (cd "$RUNNER_TEMP/copy-a" && bun pm pack --quiet --filename "$RUNNER_TEMP/pack-a/okdriver.tgz")
          (cd "$RUNNER_TEMP/copy-b" && bun pm pack --quiet --filename "$RUNNER_TEMP/pack-b/okdriver.tgz")
          sha256sum "$RUNNER_TEMP/pack-a/okdriver.tgz" "$RUNNER_TEMP/pack-b/okdriver.tgz"
          cmp "$RUNNER_TEMP/pack-a/okdriver.tgz" "$RUNNER_TEMP/pack-b/okdriver.tgz"
      - name: Check the pack
        run: bun .github/scripts/check-pack.mjs "$RUNNER_TEMP/pack-a/okdriver.tgz"
